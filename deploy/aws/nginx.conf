# Install under /etc/nginx/conf.d/gizu.conf AFTER ACME certificate enrollment.
# Host NGINX proxies to Compose's loopback-only published port.
server {
    listen 80;
    server_name gizu.io www.gizu.io app.gizu.io api.gizu.io;
    access_log off;
    error_log /var/log/nginx/gizu-error.log crit;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name gizu.io www.gizu.io;
    ssl_certificate /etc/letsencrypt/live/gizu.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gizu.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/gizu/current/landing;
    access_log off;
    error_log /var/log/nginx/gizu-error.log crit;
    location = /.well-known/apple-app-site-association {
        alias /srv/gizu/current/associations/apple-app-site-association;
        default_type application/json;
    }
    location = /.well-known/assetlinks.json {
        alias /srv/gizu/current/associations/assetlinks.json;
        default_type application/json;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl;
    server_name app.gizu.io;
    ssl_certificate /etc/letsencrypt/live/gizu.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gizu.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/gizu/current/frontend;
    access_log off;
    error_log /var/log/nginx/gizu-error.log crit;
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl;
    server_name api.gizu.io;
    ssl_certificate /etc/letsencrypt/live/gizu.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gizu.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Raw URLs can contain private recovery IDs, addresses or query data.
    access_log off;
    error_log /var/log/nginx/gizu-error.log crit;
    # Base64url JSON for a 1 MiB ciphertext exceeds NGINX's default 1 MiB.
    client_max_body_size 1398400;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Replace untrusted incoming forwarding headers for Fastify's one hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_cache off;
        add_header Cache-Control no-store always;
    }
}
