name: gizu
services:
  api:
    image: ${API_IMAGE:?Set an immutable GHCR image digest}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    env_file:
      - path: /etc/gizu/backend.env
        format: raw
    environment:
      NODE_ENV: production
      PORT: '3000'
      EARN_ANVIL_PATH: /app/.runtime/anvil-v1.8.3/anvil-fork
    ports:
      - '127.0.0.1:3000:3000'
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    pids_limit: 256
    stop_grace_period: 75s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/v1/health', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
