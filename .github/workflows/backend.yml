name: Backend
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-gas:
    name: Native gas and approval invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Verify shared vectors and native authorization contracts
        run: cargo +1.94.1 test --locked --lib --manifest-path mobile/modules/gizu-stored-signer/core/Cargo.toml
  check:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check source and test types
        run: npm run typecheck
      - name: Check shared gas preparation and arithmetic
        run: npm run gas:check
      - name: Run tests
        run: npm test 2>&1 | tee test-results.log
      - name: Compile server
        run: npm run build
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.log
          retention-days: 7
          if-no-files-found: ignore
