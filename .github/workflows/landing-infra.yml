name: Landing infrastructure
on:
  pull_request:
    paths: [deploy/landing/infra/**, .github/workflows/landing-infra.yml]
  push:
    branches: [main]
    paths: [deploy/landing/infra/**, .github/workflows/landing-infra.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        root: [bootstrap, certificate, site]
    steps:
      - uses: actions/checkout@v4
      - name: Validate with mocked providers, no AWS credentials
        env:
          ROOT: ${{ matrix.root }}
        run: |
          docker run --rm --entrypoint sh \
            -v "$GITHUB_WORKSPACE/deploy/landing/infra:/infra" -w "/infra/$ROOT" \
            -e TF_IN_AUTOMATION=true -e AWS_EC2_METADATA_DISABLED=true \
            ghcr.io/opentofu/opentofu:1.11.0 -ec '
              tofu fmt -check -recursive
              tofu init -backend=false -input=false -lockfile=readonly
              tofu validate
              tofu test
            '
