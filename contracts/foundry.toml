[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Tests read the commitment vectors shared with the native signer.
fs_permissions = [
  { access = "read", path = "../shared" },
  { access = "read", path = "./out" },
]

[fmt]
line_length = 100
